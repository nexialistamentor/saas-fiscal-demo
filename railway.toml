# Config-as-code Railway — https://docs.railway.com/guides/config-as-code
[build]
builder = "railpack"

[deploy]
preDeployCommand = "ENVIRONMENT=production PGSSLROOTCERT=config/railway_postgres_root_ca.pem alembic upgrade head"
startCommand = "ENVIRONMENT=production PGSSLROOTCERT=config/railway_postgres_root_ca.pem uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

healthcheckPath = "/health"
healthcheckTimeout = 10
